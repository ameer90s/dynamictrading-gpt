[build]
  publish = "public"
  functions = "netlify/functions"

[functions."daily-recommendation"]
  # 09:30 ET onward: discovery cycles target full eligible-universe coverage within ~10m; persistent SMART revalidation continues every 1m through the regular-session close.
  # UTC range covers both EDT and EST; the function gates on America/New_York time.
  schedule = "* 13-21 * * 1-5"

[functions."news-scan"]
  # Broader news/catalyst refresh every 15 minutes through the regular-session schedule window, offset from price scans by the function credit guard.
  schedule = "2,17,32,47 13-21 * * 1-5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[functions."outcome-tracker"]
  # Follow every CONFIRMED signal (approved or not) once per minute through the US regular-session close.
  schedule = "* 13-21 * * 1-5"

[functions."premarket-memory"]
  # Measurement-only memory snapshots before the regular session. Does not alter Dynamic Trading 3.7 recommendation logic.
  schedule = "0,15,30,45 12-13 * * 1-5"

[functions."sharia-daily-refresh"]
  # Daily zero-credit AAOIFI master refresh before the U.S. regular session (12:15 UTC).
  schedule = "15 12 * * 1-5"

[functions."ai-parallel-scan"]
  # Independent research-only scheduled scan, each minute in DST/standard hours.
  # Can require paid Alpaca quota / enough Netlify function time; does not run
  # inside the client/browser and never sends any broker order.
  schedule = "* 13-21 * * 1-5"

# Legacy ai-parallel-llm-review is not scheduled.
# Only research-openai37 schedules a single opt-in post-close review.

# DT37 ROUTING FIX: DO NOT add a catch-all /api/* rewrite.
# The browser API endpoints are directly registered via export const config.path
# in each Netlify Function (for example, latest.mjs -> /api/latest).
# Netlify removes the default /.netlify/functions/<name> route for functions
# with an explicit custom path, so proxying /api/* to that default route
# returns 404 HTML and breaks market, signals and alerts.
# Scheduled functions without a custom path are not affected.